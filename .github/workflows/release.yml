# Publishes a GitHub release with the Windows build whenever main gets a new version.
# The version is the single line in VERSION at the repo root. Bump it in a PR (minor for a
# feature, patch for fixes); when that PR merges, this builds the self-contained Windows zip
# and publishes release v<VERSION> from that commit, with notes listing the merged PRs.
# If a release for that version already exists (published or draft), it does nothing.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One group per commit: a merge that lands while another release is still building
# would otherwise replace the pending run and that version would never publish.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      # Run 160: the licensed match-day audio (Splice) lives in a private repo, never in this one (#1070). The secret is a
      # read-only token for that repo; forks and runs without it build with the M6 crowd only.
      HAS_AUDIO_TOKEN: ${{ secrets.LICENSED_AUDIO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        shell: pwsh
        run: |
          $v = (Get-Content VERSION -TotalCount 1).Trim()
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "VERSION must look like 0.30.1, got '$v'" }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Skip if this version is already released
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.v.outputs.tag }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release ${{ steps.v.outputs.tag }} already exists; nothing to do."
            "skip=true" >> $env:GITHUB_OUTPUT
          } else {
            "skip=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.check.outputs.skip == 'false'
        with:
          dotnet-version: 8.0.x

      - name: Fetch the licensed match-day audio (private repo)
        if: steps.check.outputs.skip == 'false' && env.HAS_AUDIO_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          repository: TouchLineDesk/hardwood-licensed-audio
          token: ${{ secrets.LICENSED_AUDIO_TOKEN }}
          path: licensed-audio
          persist-credentials: false

      - name: Check the licensed audio
        id: audio
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $dir = Join-Path $env:GITHUB_WORKSPACE "licensed-audio"
          if (Test-Path $dir) {
            $oggs = @(Get-ChildItem $dir -Filter *.ogg | Where-Object { $_.Name -notlike 'demo-mix*' })
            Write-Host "Licensed audio: $($oggs.Count) OGGs"
            if (-not (Test-Path (Join-Path $dir 'crowd-bed-1.ogg')) -or -not (Test-Path (Join-Path $dir 'crowd-bed-3.ogg'))) { throw "The licensed audio has no crowd-bed-1/3.ogg" }
            "dir=$dir" >> $env:GITHUB_OUTPUT
          } else {
            Write-Host "No licensed audio (no token): building with the M6 crowd only."
            "dir=" >> $env:GITHUB_OUTPUT
          }

      - name: Build the Windows zip
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.v.outputs.version }}"
          $dir = "HardwoodManager-$v"
          $audio = "${{ steps.audio.outputs.dir }}"
          $extra = @()
          if ($audio -ne "") { $extra += "-p:LicensedAudioDir=$audio" }
          dotnet publish src/Hardwood.Desktop -c Release -r win-x64 --self-contained true -p:Version=$v -o $dir @extra
          Copy-Item THIRD-PARTY-NOTICES.md $dir
          Compress-Archive -Path $dir -DestinationPath "HardwoodManager-v$v-win-x64.zip"

      - name: Publish the release
        if: steps.check.outputs.skip == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.v.outputs.version }}"
          # Run 206: a version listed in .github/release-titles.txt ("0.194.0 | <title> | <first line of the notes>")
          # gets that title and opening line (the launch build); every other version is "Hardwood Manager X.Y.Z".
          $title = "Hardwood Manager $v"
          $lead = ""
          $list = ".github/release-titles.txt"
          if (Test-Path $list) {
            foreach ($line in Get-Content $list) {
              if ($line.Trim().StartsWith('#') -or $line.Trim() -eq '') { continue }
              $parts = $line.Split('|') | ForEach-Object { $_.Trim() }
              if ($parts[0] -eq $v -and $parts.Count -ge 2 -and $parts[1] -ne '') {
                $title = $parts[1]
                if ($parts.Count -ge 3) { $lead = ($parts[2..($parts.Count - 1)] -join ' | ') }
              }
            }
          }
          Write-Host "Release title: $title"
          $notes = @()
          if ($lead -ne '') { $notes += @('--notes', $lead) }
          gh release create "v$v" "HardwoodManager-v$v-win-x64.zip" `
            --repo "${{ github.repository }}" `
            --target "${{ github.sha }}" `
            --title "$title" `
            --generate-notes @notes
