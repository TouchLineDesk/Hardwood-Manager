# Builds the game and runs every test on each push and pull request,
# so nothing is merged broken. Results show as a check on each PR.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shard:
    # Danny, Nov 21, 2026: the suite runs in 3 parallel shards (about 30 min in one job by run 146).
    # tools/ci/shard.py splits the test classes by their recorded time (tools/ci/timings.json);
    # every class lands in exactly one shard. The "test" job below keeps the old check's name
    # and says whether all three passed.
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Each shard took about 10 minutes on PR #215; 45 leaves room for an unlucky split.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore Hardwood.sln
      - name: Build
        run: dotnet build Hardwood.sln --no-restore -c Release
      - name: Pick this shard's tests
        id: pick
        run: |
          dotnet test tests/Hardwood.Tests --no-build -c Release --list-tests > tests-list.txt
          filter=$(python3 tools/ci/shard.py $(( ${{ matrix.shard }} - 1 )) 3 tests-list.txt)
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
      - name: Test
        run: dotnet test tests/Hardwood.Tests --no-build -c Release --filter "${{ steps.pick.outputs.filter }}" --logger "trx;LogFileName=results-${{ matrix.shard }}.trx" --results-directory test-results
      - name: Keep test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shard }}
          path: test-results
  test:
    # One check for all three shards (red if any shard failed or was cancelled).
    if: always()
    needs: test-shard
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.test-shard.result }}" = "success"
  windows-build:
    # The game ships for Windows; make sure it still publishes.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish Windows build
        run: dotnet publish src/Hardwood.Desktop -c Release -r win-x64 --self-contained true -o publish
      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: HardwoodManager-win-x64
          path: publish
          retention-days: 14
